
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha | Men's Store</title>
</head>
<body>

    <h1>Recuperar minha senha</h1>

    <p>Informe seu e-mail cadastrado para receber o link de recuperação.</p>

    <form method="POST" action="/recuperar-senha">

        <label>E-mail:</label>

        <input
            type="email"
            name="email"
            required
        >

        <button type="submit">ENVIAR LINK</button>

    </form>

    <p>{{ mensagem }}</p>

    <a href="/login">Voltar para o login</a>

</body>
</html>
