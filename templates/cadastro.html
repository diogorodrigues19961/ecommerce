
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro | Men's Store</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .cadastro {
            background: #1c1c1c;
            width: 90%;
            max-width: 420px;
            padding: 35px;
            border-radius: 12px;
            border: 1px solid #333;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 span {
            color: #d4af37;
        }

        label {
            display: block;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #292929;
            color: white;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #d4af37;
            color: #111;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #f0ca50;
        }

        .mensagem {
            text-align: center;
            margin-bottom: 20px;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #d4af37;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="cadastro">

        <h1>MEN'S <span>STORE</span></h1>

        <h2>Crie sua conta</h2>

        {% if mensagem %}
            <p class="mensagem">{{ mensagem }}</p>
        {% endif %}

        <form action="/cadastro" method="POST">

            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required>

            <input
      type="password"
     name="senha"
    minlength="8"
    pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9]).{12,}"
    title="A senha deve ter pelo menos 12 caracteres, uma letra maiúscula, uma minúscula e um número."
    required
>

            <button type="submit">CADASTRAR</button>

        </form>

        <a href="/" class="voltar">Voltar para a loja</a>

    </div>

</body>
</html>
